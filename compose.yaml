# CloudVault with its own storage, in one command:
#
#   docker compose up --build        → http://localhost:8000
#
# This starts the app and a RustFS storage (an open-source, S3-compatible store; its console is on
# http://localhost:9001), and the app creates the bucket on its first start. The data lives in the
# `storage-data` volume. The default login is cloudvault / cloudvault-secret: fine on your own
# machine, change it (see .env.example) before putting this anywhere else.
#
# To use a storage you already have (Cloudflare R2, AWS S3, another MinIO) instead, put its
# settings in a `.env` file next to this one (see .env.example) and start only the app:
#
#   docker compose up --build --no-deps cloudvault
#
# Files go straight between the browser and the storage through presigned links, so the browser
# must be able to reach the storage too. S3_PUBLIC_ENDPOINT is the address the browser uses; the
# app itself talks to S3_ENDPOINT. With the bundled storage they are two names for the same store.

name: cloudvault

services:
  cloudvault:
    build: .
    image: ${CLOUDVAULT_IMAGE:-cloudvault:local}
    ports:
      - '8000:8000'
    environment:
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      # Without a storage of your own the links point at the bundled one as the browser sees it;
      # with one (S3_ENDPOINT set) they use that address, unless you give another here
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT:-http://localhost:9000}}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-cloudvault}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cloudvault}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cloudvault-secret}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      # A fresh local storage has no bucket yet. Turn this off for a real one (see .env.example).
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}
    depends_on:
      storage:
        condition: service_healthy
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.1}
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-cloudvault}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-cloudvault-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
      # The page is served from port 8000 and sends files straight to port 9000
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:8000
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  storage-data:
