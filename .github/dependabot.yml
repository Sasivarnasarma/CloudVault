version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (root lockfile)
    directory: /
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    groups:
      api:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ['*']
    ignore:
      # Node moves between LTS releases on purpose (odd-numbered majors are short-lived);
      # minor and patch updates still come through
      - dependency-name: node
        update-types: ['version-update:semver-major']
